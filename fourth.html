<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback Form</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <br>
    <form>
        <div>
        <lable for="name">Name:</lable>
        <input type="text" id="name" name="name" placeholder="Write yoyr name">
    </div><br>
    <div>
        <lable for="mail">Email:</lable>
        <input type="email" id="mail" name="mail" placeholder="Write your emai">
    </div><br>
    Message:<br>
    <textarea name="feedback" id="feedback" rows="10" cols="80"></textarea><br><br>
    <div>
      Rate us our of 5:<br>

     </div> 
      
      
      
    <br><br>
    <button type="submit">Enter your message!</button>
    </form>
</body>
</html>
